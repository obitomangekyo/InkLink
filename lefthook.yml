pre-commit:
  jobs:
    - name: biome staged check
      run: pnpm biome check --write --staged --no-errors-on-unmatched
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      files: git ls-files
      run: pnpm typecheck
    - name: build
      files: git ls-files
      run: pnpm build
